<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Scraper</title>
  <style>
    :root {
      --bg-color: #1e1e1e;
      --bg-color-light: #2d2d2d;
      --text-color: #e0e0e0;
      --border-color: #444;
      --accent-color: #007acc;
      --accent-hover: #005f9e;
      --danger-color: #d32f2f;
      --danger-hover: #b71c1c;
      --success-color: #388e3c;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: var(--accent-color);
    }

    .section {
      background-color: var(--bg-color-light);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="text"],
    textarea,
    select {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.danger {
      background-color: var(--danger-color);
    }

    button.danger:hover {
      background-color: var(--danger-hover);
    }

    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .flex-row > * {
      flex: 1;
    }

    .flex-row > button {
      flex: 0 0 auto;
    }

    .selector-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .selector-row > button {
      padding: 4px 8px;
    }

    #statusLog {
      background-color: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      overflow-y: auto;
      flex-grow: 1;
      border: 1px solid var(--border-color);
      white-space: pre-wrap;
    }

    .schema-toggle {
      display: flex;
      gap: 16px;
    }

    .schema-toggle label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="section">
    <h2>Profile Management</h2>
    <div class="flex-row">
      <select id="profileSelect">
        <option value="">-- Select Profile --</option>
      </select>
      <button id="deleteProfileBtn" class="danger">Delete</button>
    </div>
    <div class="flex-row">
      <input type="text" id="profileName" placeholder="Profile Name">
      <button id="saveProfileBtn">Save</button>
    </div>
  </div>

  <div class="section">
    <h2>URLs</h2>
    <textarea id="urlList" placeholder="https://example.com/item1&#10;https://example.com/item2"></textarea>
  </div>

  <div class="section">
    <h2>CSS Selectors</h2>
    <div id="selectorsContainer"></div>
    <button id="addSelectorBtn">+ Add Selector</button>
  </div>

  <div class="section">
    <h2>CSV Schema</h2>
    <div class="schema-toggle">
      <label>
        <input type="radio" name="schema" value="wide" checked> Wide
      </label>
      <label>
        <input type="radio" name="schema" value="long"> Long
      </label>
    </div>
  </div>

  <div class="section" style="flex-grow: 1;">
    <h2>Execution</h2>
    <button id="startScrapeBtn">Start Scraping</button>
    <div id="statusLog">Ready.</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
